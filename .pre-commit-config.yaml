repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(reinforcement_learning|tests)/
      - id: end-of-file-fixer
        files: ^(reinforcement_learning|tests)/

  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        args: [--line-length=120]
        files: ^(reinforcement_learning|tests)/

      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
        args: [--fix]
        files: ^(reinforcement_learning|tests)/

      - id: bandit
        name: bandit
        entry: bandit
        language: system
        types: [python]
        args: [-r, reinforcement_learning, tests]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        files: ^(reinforcement_learning|tests)/

      - id: unittest
        name: unittest
        entry: python -m unittest discover -s tests -v
        language: system
        types: [python]
        pass_filenames: false
        files: ^(reinforcement_learning|tests)/
