name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^-e ' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          pip install -e .

      - name: Ruff
        run: ruff check reinforcement_learning tests

      - name: Bandit
        run: bandit -r reinforcement_learning tests

      - name: Mypy
        run: mypy reinforcement_learning tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v
