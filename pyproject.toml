[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reinforcement_learning"
version = "0.1.0"
description = "Notes and exercises while reading Reinforcement Learning by Phil Winder"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
authors = [
    { name = "Andrew Tunison" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit",
    "black",
    "mypy",
    "pre-commit",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reinforcement_learning*"]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["reinforcement_learning"]
